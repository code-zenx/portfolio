name: Release

# release-it creates the tag and pushes it; this turns that tag into a
# GitHub Release so it shows up in the repo's Releases panel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          # conventional-changelog writes either "## [1.2.3](compare-url) (date)"
          # or, for a first release, "## 1.2.3 (date)". Handle both.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 { inside = 1; next }
            inside && index($0, "## ") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
